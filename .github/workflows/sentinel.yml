name: Sentinel MVP
on:
  push:
    paths: ['sentinel/**', '.github/workflows/sentinel.yml']
  pull_request:
    paths: ['sentinel/**', '.github/workflows/sentinel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest sentinel.tests.test_sentinel -v
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node sentinel/tests/ui_contract.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest sentinel.tests.test_browser -v
