name: staged portfolio projects
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cli:
    strategy:
      matrix:
        project: [slo-budget-calculator, incident-timeline-merge, configuration-drift-map, dns-zone-sanity]
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tool.py example.json
  browser:
    # Playwright 1.56 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio/ui-action-contracts
    env:
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python tool.py demo.html contract.json
